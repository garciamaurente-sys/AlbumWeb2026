<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Mundial 2026 - Edición Deluxe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Álbum 2026</h1>
            <div class="header-actions">
                <div class="stats" id="stats-container">Cargando...</div>
                <button class="btn-action" onclick="abrirModal()">Mis Repetidas</button>
            </div>
        </div>
        <div class="nav-grupos" id="nav-container"></div>
    </header>

    <div class="container" id="album-container"></div>

    <div class="modal" id="modal-repetidas">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h2 class="modal-title">Listado para Cambiar</h2>
            <div id="lista-repetidas"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
